[package]
name = "discord-bot"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Discord voice-room management and optional website counters"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = { version = "0.27", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serenity = { version = "0.12.5", default-features = false, features = ["cache", "client", "gateway", "model", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
